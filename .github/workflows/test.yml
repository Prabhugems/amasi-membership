name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  # Diff-scoped lint. The repo carries ~300 pre-existing ESLint errors (mostly
  # @typescript-eslint/no-explicit-any in fragile payment / zoho code), so a
  # full-repo lint would fail every PR on legacy debt. eslint-plugin-diff (via
  # eslint.config.ci.mjs) filters reports down to lines changed relative to the
  # PR base branch, so this job blocks only on problems the PR itself introduces.
  # Mirrors the pre-commit hook (eslint.config.staged.mjs). PR-only: on push to
  # main there is no base to diff against.
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so origin/<base> is present for the diff.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint changed lines only
        run: npx eslint --config eslint.config.ci.mjs .
        env:
          ESLINT_PLUGIN_DIFF_COMMIT: origin/${{ github.base_ref }}

  # Blocks PRs that introduce a new dependency with a known vulnerability or
  # an incompatible license. Dependabot only patches deps already declared;
  # this is the check that catches one added fresh by a PR (typosquat,
  # abandoned package, known-CVE version) before it merges.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Catches the Suspense / static-prerender class of bug that tsc and eslint miss.
  # See AGENTS.md "Local build after client-router hook changes" for context.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (validates Suspense / static prerender)
        run: npx next build
        env:
          # Build needs at least the public envs present; keep these as repo
          # secrets. Server-only envs are not required to validate the prerender.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
